<style>
/* Layout: full-bleed 3D town; scrappy HUD pinned to corners; every menu is a front page of the local paper reporting on Tom. */
:root{
  --comb:#d9281e; --corn:#f7bd22; --dung:#6d4524; --sod:#27502a;
  --paper:#ebe7d8; --ink:#1b1913; --sky:#8fd3ea; --white:#fffdf4;
  --display:"Rammetto One","Arial Black",Impact,sans-serif;
  --headline:"Abril Fatface",Georgia,"Times New Roman",serif;
  --news:"Old Standard TT",Georgia,"Times New Roman",serif;
  --hand:"Patrick Hand","Comic Sans MS","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--hand);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#overlay{touch-action:pan-y}
button:focus-visible{outline:3px solid var(--comb);outline-offset:2px}

#hud{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;color:var(--white);text-shadow:0 2px 0 rgba(0,0,0,.55)}
#hud[hidden]{display:none}
#scoreBox{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px))}
#score{font:400 clamp(28px,5vw,46px)/1 var(--display);font-variant-numeric:tabular-nums}
#comboRow{display:flex;align-items:center;gap:8px;height:30px;font:400 22px/1 var(--display);color:var(--corn)}
#comboBar{width:92px;height:8px;background:rgba(0,0,0,.4);border-radius:1px;overflow:hidden}
#comboBar i{display:block;height:100%;background:var(--corn);width:0}
#missions{margin-top:6px;font-size:clamp(16px,2.2vw,20px);line-height:1.15;display:grid;gap:3px;max-width:min(330px,62vw)}
#missions div{display:flex;gap:6px;justify-content:space-between}
#missions div:first-child{color:var(--corn)}
#missions small{font-size:inherit;white-space:nowrap;font-variant-numeric:tabular-nums}

#ad{display:block;pointer-events:auto;text-align:left;margin-top:8px;width:min(310px,58vw);background:var(--paper);color:var(--ink);border:0;padding:6px 9px 8px;font:400 clamp(13px,1.8vw,15px)/1.2 var(--news);text-shadow:none;transform:rotate(-.8deg);box-shadow:2px 3px 0 rgba(0,0,0,.4)}
#ad small{display:block;font:700 10px/1.2 var(--news);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:2px;margin-bottom:3px}
#ad b{display:block;font:400 clamp(15px,2vw,18px)/1.1 var(--headline);margin-bottom:2px}
#breaking{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--comb);color:var(--white);padding:5px 13px;font:400 clamp(13px,2.2vw,20px)/1.1 var(--display);text-align:center;max-width:46vw;text-shadow:none;box-shadow:3px 3px 0 var(--ink)}
.clue{font-size:14px;line-height:1.28;padding:6px 0;border-bottom:1px dotted var(--ink);display:block}
.clue b{font:400 17px/1.15 var(--headline);display:block}
.clue.d b{color:var(--comb)}
.clue summary{cursor:pointer;font-size:13px;font-style:italic;margin-top:3px}
@media (max-width:760px){#ad{width:min(230px,56vw);font-size:12px}#breaking{top:auto;bottom:calc(238px + env(safe-area-inset-bottom,0px));max-width:80vw}}
@media (max-height:480px){#ad{width:min(240px,38vw);font-size:11px;padding:4px 7px 5px}#ad small{display:none}#ad b{font-size:13px}}
#topRight{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#stars{font:400 clamp(20px,3.4vw,30px)/1 var(--display);letter-spacing:2px;color:rgba(255,255,255,.28)}
#stars b{font-weight:400;color:var(--comb);-webkit-text-stroke:1px var(--white)}
#heatLabel{font-size:17px;min-height:19px}
.hudBtns{display:flex;gap:6px;pointer-events:auto}
.hudBtns button{background:var(--ink);color:var(--paper);border:0;padding:6px 11px;font-size:17px;border-radius:2px;text-shadow:none}

#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:5px;width:min(420px,46vw)}
#gutLabel{font-size:18px}
#gut{width:100%;height:16px;background:rgba(0,0,0,.45);border:2px solid var(--ink);overflow:hidden;position:relative}
#gut i{display:block;height:100%;background:var(--dung);box-shadow:inset 0 3px 0 #94683c}
#gut u{position:absolute;top:0;bottom:0;left:0;background:var(--corn);opacity:.85;width:0}
#flaps{display:flex;gap:4px;height:9px}
#flaps i{width:20px;background:var(--white);opacity:.9;transform:skewX(-20deg)}
#flaps i.off{opacity:.2}
#status{font:400 clamp(15px,2.2vw,20px)/1.1 var(--display);color:var(--corn);min-height:20px;text-align:center}

#floats{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
.fl{position:absolute;font:400 clamp(14px,2.2vw,21px)/1.05 var(--display);color:var(--white);white-space:nowrap;transform:translate(-50%,-50%);animation:rise 1.25s ease-out forwards;-webkit-text-stroke:.6px var(--ink);text-align:center}
.fl em{display:block;font-style:normal;color:var(--corn);font-size:.8em}
@keyframes rise{0%{opacity:0;margin-top:14px;scale:.6}14%{opacity:1;scale:1.14}24%{scale:1}100%{opacity:0;margin-top:-72px}}

#slip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:32%;width:min(300px,62vw);background:var(--paper);color:var(--ink);padding:9px 13px 11px;text-shadow:none;transform:rotate(1.6deg) translateX(130%);transition:transform .35s cubic-bezier(.2,1.4,.5,1);box-shadow:3px 4px 0 rgba(0,0,0,.4)}
#slip.on{transform:rotate(1.6deg) translateX(0)}
#slip small{display:block;font:700 11px/1.2 var(--news);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:5px}
#slip b{display:block;font:400 clamp(17px,2.4vw,22px)/1.08 var(--headline);text-wrap:balance}
#slip span{display:block;font:400 13px/1.2 var(--news);margin-top:5px}

#net{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 clamp(22px,5vw,44px)/1.1 var(--display);color:var(--corn);text-align:center;-webkit-text-stroke:1px var(--ink)}
#vig{position:absolute;top:0;right:0;bottom:0;left:0;box-shadow:inset 0 0 90px 20px rgba(217,40,30,0);transition:box-shadow .4s}

#touch{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none}
#stick{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(27,25,19,.28);border:3px solid rgba(255,253,244,.55);pointer-events:auto;touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,253,244,.85)}
#pads{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,62px);grid-auto-rows:62px;gap:7px}
#pads button{pointer-events:auto;touch-action:none;border:3px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font:400 16px/1 var(--hand);padding:0;text-shadow:none}
#pads button:active,#pads button.dn{background:var(--corn)}
#pads #bPoop{background:var(--dung);color:var(--white)}
#pads #bFlap{background:var(--white)}
@media (max-width:760px){#bottom{bottom:calc(158px + env(safe-area-inset-bottom,0px));width:min(240px,58vw)}#missions div:nth-child(n+2){display:none}#slip{top:24%}}
@media (max-height:480px){#bottom{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(220px,30vw)}#gutLabel{display:none}#pads{grid-template-columns:repeat(3,52px);grid-auto-rows:52px}#stick{width:104px;height:104px}#missions div:nth-child(n+2){display:none}}

#cut{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:5}
#cut .bar{position:absolute;left:0;right:0;background:#0d0c09;color:#f4efe0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;animation:barIn .35s ease-out both}
#cut .top{top:0;min-height:calc(13vh + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);--from:-100%}
#cut .bot{bottom:0;min-height:calc(19vh + env(safe-area-inset-bottom,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));--from:100%;align-items:center;text-align:center}
#cutTitle{font:400 clamp(16px,3.2vw,30px)/1.1 var(--display);color:var(--corn)}
#cut small{font:700 11px/1.2 var(--news);letter-spacing:.1em;text-transform:uppercase;opacity:.72;margin-bottom:4px}
#cutCap{margin:0;font:400 clamp(17px,3vw,29px)/1.16 var(--headline);max-width:34em;text-wrap:balance;animation:capIn .4s ease-out both}
#cutSkip{position:absolute;pointer-events:auto;right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));background:var(--paper);color:var(--ink);border:0;padding:7px 14px;font:400 18px/1 var(--hand)}
body.cut #scoreBox,body.cut #topRight,body.cut #bottom,body.cut #touch,body.cut #slip,body.cut #breaking,body.cut #net{display:none!important}
@keyframes barIn{from{transform:translateY(var(--from))}to{transform:none}}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#cut .bar,#cutCap{animation:none}}
#overlay{position:fixed;top:0;right:0;bottom:0;left:0;overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(20,40,30,.28);-webkit-overflow-scrolling:touch}
.paperPage{max-width:680px;margin:0 auto;background:var(--paper);color:var(--ink);padding:16px clamp(16px,4vw,32px) 24px;transform:rotate(-.5deg);box-shadow:6px 8px 0 rgba(0,0,0,.35);font-family:var(--news);user-select:text;-webkit-user-select:text}
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:5px}
.mast b{font:400 clamp(21px,4.4vw,32px)/1.05 var(--headline)}
.mast span{font-size:13px;letter-spacing:.03em}
.big{font:400 clamp(50px,13.5vw,106px)/.92 var(--display);color:var(--comb);margin:14px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.big.h{font:400 clamp(30px,6.8vw,54px)/1.02 var(--headline);color:var(--ink);margin:12px 0 6px}
.deck{font-size:clamp(17px,2.6vw,21px);line-height:1.28;font-style:italic;margin:0 0 12px;max-width:60ch}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 15px}
.cta button{background:var(--comb);color:var(--white);border:3px solid var(--ink);padding:11px 19px;font:400 clamp(16px,2.8vw,20px)/1 var(--display);box-shadow:3px 3px 0 var(--ink)}
.cta button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.cta button.alt{background:var(--paper);color:var(--ink);font-family:var(--news);font-weight:700}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 22px;border-top:1px solid var(--ink);padding-top:10px}
.cols>div{min-width:0}
h3{font:700 13px/1.2 var(--news);letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px;padding-bottom:3px;border-bottom:1px solid var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:15px;line-height:1.25}
.keys dt{font-weight:700;white-space:nowrap}
.keys dd{margin:0}
.list{list-style:none;padding:0;margin:0;font-size:15px;line-height:1.25;display:grid;gap:4px}
.list li{display:flex;justify-content:space-between;gap:9px}
.list li.d{text-decoration:line-through;opacity:.6}
.list small{white-space:nowrap;font-size:inherit;font-variant-numeric:tabular-nums}
.perk{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.2;padding:3px 0;cursor:pointer}
.perk.lock{opacity:.5;cursor:default}
.perk input{margin:2px 0 0;accent-color:var(--comb);width:17px;height:17px;flex:none}
.stats{font-size:15px;line-height:1.35;margin:0 0 10px}
.foot{margin-top:12px;font-size:13px;border-top:1px solid var(--ink);padding-top:6px}
#cutm{background:none;border:0;text-decoration:underline;padding:0;font:inherit}
#gfx{background:none;border:0;text-decoration:underline;padding:0;font:inherit}
#wipe{background:none;border:0;text-decoration:underline;padding:0;font:inherit}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.9s}#slip{transition:none}}
</style>

<script>
"use strict";
(function(){
const $=id=>document.getElementById(id);

(function sky(){const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#3f9fdc');g.addColorStop(.55,'#9ddcec');g.addColorStop(.72,'#fbf0c9');g.addColorStop(1,'#fbf0c9');x.fillStyle=g;x.fillRect(0,0,4,256);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;scene.background=t})();

{const s=sun.shadow.camera;s.left=-46;s.right=46;s.top=46;s.bottom=-46;s.near=1;s.far=240;sun.shadow.bias=-.0006;}

/* ---------- shared builders ---------- */

/* ---------- static world ---------- */
const cols=[];
function col(x,z,w,d,y1,y0=0){const c={x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y0,y1};cols.push(c);return c}
function solve(p,v,r,h,off){let hit=0;const feet=p.y-off;
  for(const c of cols){
    if(p.x+r<c.x0||p.x-r>c.x1||p.z+r<c.z0||p.z-r>c.z1)continue;
    if(feet>=c.y1-.7||feet+h<=c.y0)continue;
    if(c.y0>0&&feet+h-c.y0<1.3&&v.y>-2){p.y-=feet+h-c.y0;if(v.y>0)v.y=0;continue}
    const a=p.x+r-c.x0,b=c.x1-(p.x-r),e=p.z+r-c.z0,f=c.z1-(p.z-r),m=Math.min(a,b,e,f);

 camP.set(camT.x+dx*L,Math.max(.7,camT.y+dy*L),camT.z+dz*L);cam.position.copy(camP);
 if(G.shake>0){cam.position.x+=rand(-1,1)*G.shake;cam.position.y+=rand(-1,1)*G.shake*.7;cam.position.z+=rand(-1,1)*G.shake;G.shake=Math.max(0,G.shake-dt*2.6)}
 cam.lookAt(camT);
}

/* menus */
function headlines(){const done=missions.filter(m=>m.done);return done.length?done[done.length-1].h:(G.score>2000?'Rooster Sighted, Town Regrets Noticing':'Quiet Morning In Clucksworth, Residents Nervous')}
const edDate=()=>new Date().toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long'});
const controlsHTML=()=>touchUI?`<dl class="keys"><dt>Left pad</dt><dd>Run. Push to the rim to sprint</dd><dt>Drag</dt><dd>Look around</dd><dt>Flap</dt><dd>Jump, then 6 flaps. Hold to glide</dd><dt>Poop</dt><dd>Tap to drop, hold for a mega drop</dd><dt>Peck</dt><dd>Kick anyone in range</dd><dt>Crow</dt><dd>Scare the town. Sends your hens in</dd><dt>Grab</dt><dd>Carry a thing or person, tap to throw</dd><dt>Flop</dt><dd>Go limp on purpose</dd></dl>`:`<dl class="keys"><dt>WASD / arrows</dt><dd>Run. Shift to sprint</dd><dt>Mouse</dt><dd>Look. Wheel zooms</dd><dt>Space</dt><dd>Jump, then 6 flaps. Hold to glide</dd><dt>Left click / E</dt><dd>Poop. Hold for a mega drop</dd><dt>Right click / F</dt><dd>Peck and kick</dd><dt>Q</dt><dd>Crow. Scares town, sends in hens</dd><dt>G</dt><dd>Grab with beak, G again to throw</dd><dt>T</dt><dd>Flop on purpose</dd><dt>R / Esc</dt><dd>Back to farm / pause</dd></dl>`;
function perksHTML(){const c=doneCount(),qc=qDone();return perks.map(p=>{const on=p.qid==='*'?qc===quests.length:p.qid?quests.find(q=>q.id===p.qid).done:p.q?qc>=p.q:c>=p.need;return `<label class="perk ${on?'':'lock'}"><input type="checkbox" id="perk-${p.id}" ${on?'':'disabled'} ${G.perk[p.id]?'checked':''}><span><b>${p.name}</b> ${on?p.d:(p.qid==='*'?'Locked until every classified is solved.':p.qid?`Locked. Solve ${quests.find(q=>q.id===p.qid).name}.`:p.q?`Locked until ${p.q} classifieds.`:`Locked until ${p.need} scoops.`)}</span></label>`}).join('')}
function showMenu(pauseMode){$('overlay').hidden=false;const bestLine=G.best?`Best shift on record: <b>${G.best.toLocaleString('en-NZ')}</b> chaos.`:'No chaos on record yet.';
 const missionHTML=missions.map(m=>`<li class="${m.done?'d':''}"><span>${m.t}</span><small>${m.done?'Printed':(m.n>1?m.cur+'/'+m.n:'')}</small></li>`).join('');
 $('page').innerHTML=`<div class="mast"><b>The Clucksworth Gazette</b><span>${edDate()} · Late edition · Wipe before reading</span></div>`+
 (pauseMode?`<div class="big h">${headlines()}</div>
   <p class="stats">Chaos so far: <b>${G.score.toLocaleString('en-NZ')}</b>. ${G.stats.people} residents upended, ${G.stats.props} items wrecked, ${G.stats.cars} cars airborne, ${G.stats.booms} explosions, ${G.stats.poops} droppings. ${bestLine}</p>
   <div class="cta"><button id="go" type="button">Back to the chaos</button></div>`
  :`<h1 class="big">Chicken Tom</h1>
   <p class="deck">Rooster at large in Clucksworth. He has a full gut, a loud voice and no respect for property. Residents are advised to carry umbrellas.</p>
   <div class="cta"><button id="go" type="button">Start the chaos</button></div>`)+
 `<div class="cols"><div><h3>How to be a menace</h3>${controlsHTML()}<p class="stats" style="margin:8px 0 0">Controller: left stick runs, right stick looks, A flaps, X or RT poops, B pecks, Y crows, LB grabs, RB flops, Start pauses, Back shows the next ad.${touchUI?'':' No mouse lock? Drag to look, or use J, L, I and K.'}</p></div>
   <div><h3>${pauseMode?'Perks':'Eat corn. Crow often.'}</h3>${pauseMode?perksHTML():'<p class="stats" style="margin:0 0 6px">Corn refills your gut. Chili makes it fire on full auto. Golden corn hides on the rooftops. Chaos raises your wanted stars. The farmer and Animal Control are slow and give up quickly, so run or poop on them. Solve classifieds to earn new perks.</p>'+perksHTML()}</div></div>
  <div class="cols" style="margin-top:12px"><div><h3>Classifieds · ${qDone()}/${quests.length} solved. Solve them again any time</h3>${quests.map(q=>`<div class="clue ${q.done?'d':''}"><b>${q.name}${q.done?' · Done':''}</b>${q.ad} <i>Reward: ${perks.find(p=>p.id===q.reward).name}.</i><details><summary>Give me a hint</summary>${q.hint}</details></div>`).join('')}</div></div>
  <div class="cols" style="margin-top:12px"><div><h3>Front page scoops · ${doneCount()}/${missions.length}</h3><ul class="list">${missionHTML}</ul></div></div>
  <p class="foot">${bestLine} <button id="gfx" type="button" class="lnk">Graphics: ${GFX.mode}</button> · <button id="cutm" type="button" class="lnk">Cutscenes: ${CS.mode}</button> · <button id="wipe" type="button">Wipe saved progress</button></p>`;
 $('go').addEventListener('click',resume);$('go').focus({preventScroll:true});
 perks.forEach(p=>{const i=$('perk-'+p.id);if(i)i.addEventListener('change',()=>{G.perk[p.id]=i.checked;applyPerks();persist()})});
 $('gfx').addEventListener('click',e=>{GFX.mode={Auto:'High',High:'Low',Low:'Auto'}[GFX.mode];setLevel(GFX.mode==='High'?0:GFX.mode==='Low'?2:(coarse?1:0));e.target.textContent='Graphics: '+GFX.mode});$('cutm').addEventListener('click',e=>{CS.mode={On:'Short',Short:'Off',Off:'On'}[CS.mode];e.target.textContent='Cutscenes: '+CS.mode;persist()});let armed=false;$('wipe').addEventListener('click',e=>{if(!armed){armed=true;e.target.textContent='Click again to erase scoops and best score';return}try{localStorage.removeItem(SAVE)}catch(_){ }location.reload()})}
function resume(){initAudio();if(G.mode==='menu')G.stats.people=G.stats.props=G.stats.cars=G.stats.booms=0;G.mode='play';$('overlay').hidden=true;$('hud').hidden=false;$('touch').hidden=!touchUI;renderMissions();canvas.focus({preventScroll:true});if(!touchUI&&!locked){try{const p=canvas.requestPointerLock&&canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();if(camT.lengthSq()===0||!resume.ok){camT.copy(tom.p);camYaw=0;resume.ok=true}persist()}
function pause(){if(G.mode!=='play')return;G.mode='pause';if(locked&&document.exitPointerLock)document.exitPointerLock();showMenu(true);persist();if(held.poop)act('poop',false)}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.8;$('bMute').textContent=muted?'Sound off':'Sound on';persist()}
$('bMute').addEventListener('click',()=>{initAudio();toggleMute()});$('bPause').addEventListener('click',pause);$('cutSkip').addEventListener('click',()=>{CS.age=1;skipCut()});$('ad').addEventListener('click',()=>{adI++;renderAd();canvas.focus({preventScroll:true})});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')pause()});

/* restore save */
(function(){const s=load();G.best=s.best||0;if(s.cuts)CS.mode=s.cuts;(s.q||[]).forEach(id=>{const q=quests.find(x=>x.id===id);if(q){q.done=true;G.perk[q.reward]=true}});if(qDone()===quests.length)G.perk.goldtom=true;renderAd();muted=!!s.muted;$('bMute').textContent=muted?'Sound off':'Sound on';
 (s.done||[]).forEach(id=>{const m=missions.find(x=>x.id===id);if(m){m.done=true;m.cur=m.n}});
 const gm=missions.find(m=>m.id==='gold');const g=s.gold||{};G.gold=g;let c=0;for(const u of pickups){if(u.kind==='gold'&&g[u.id]){u.on=false;u.o.visible=false;c++}}if(!gm.done)gm.cur=c;
 const dc=doneCount();perks.forEach(p=>{if(dc>=p.need&&p.id!=='moon'&&p.id!=='giant')G.perk[p.id]=true});if(s.perk)perks.forEach(p=>{if(p.id in s.perk)G.perk[p.id]=!!s.perk[p.id]});applyPerks();
 tom.yaw=0;showMenu(false);renderMissions()})();

/* ---------- main loop ---------- */
let last=performance.now(),paused=false;
function tick(now){requestAnimationFrame(tick);const raw=(now-last)/1000;let dt=Math.min(raw,.066);last=now;pollPad();gfxTick(raw);if(G.mode==='play'){cutTick(dt);if(CS.on)dt*=CS.slow}
 if(G.mode==='pause'){renderer.render(scene,cam);return}
 G.time+=dt;
 // two substeps keeps fast things from tunnelling
 const sub=dt/2;for(let s=0;s<2;s++){if(G.mode==='play'){stepTom(sub);stepPoops(sub)}stepProps(sub)}
 if(G.mode==='menu'){tom.obj.position.copy(tom.p);tom.wings[0].rotation.z=-Math.abs(Math.sin(G.time*2))*.4;tom.wings[1].rotation.z=Math.abs(Math.sin(G.time*2))*.4}
 stepQuests(dt);for(const n of npcs)stepNPC(n,dt);for(const c of cars)stepCar(c,dt);stepHens(dt);stepParticles(dt);stepHeat(dt);
 blades.rotation.z+=dt*1.6;tgBell.cd-=dt;if(bell.userData.sw>0){bell.userData.sw-=dt*.45;bell.rotation.z=Math.sin(G.time*10)*.55*bell.userData.sw}
 if(statue.fallen&&statue.rotation.x<Math.PI/2.05){statue.rotation.x+=dt*(.5+statue.rotation.x*2.3);statue.position.y=-Math.sin(statue.rotation.x)*1;if(statue.rotation.x>=Math.PI/2.05){S.boom();G.shake=.9;burst(V(0,1,-16),40,'#7c9b83',10,8,.8,.9);for(const n of npcs)if(n.active&&n.p.distanceTo(tgStatue.p)<10)knock(n,V(rand(-6,6),11,rand(-6,6)),'STATUE FELL',120)}}
 for(const u of pickups){if(!u.on)continue;u.o.rotation.y+=dt*2;u.o.position.y=u.y+Math.sin(G.time*2.6+u.bobO)*.2}
 for(const t of tramps){if(t.t>0){t.t-=dt;t.pad.position.y=1.05-Math.sin(t.t*12.5)*.5}}
 for(const f of flashes){if(f.t>0){f.t-=dt;const k=1-f.t/.4;f.m.scale.setScalar(f.R*(.25+k*.75));f.m.material.opacity=Math.max(0,(1-k)*.9);if(f.t<=0)f.m.visible=false}}
 if(ringT>0){ringT-=dt;const k=1-ringT/.55;const s=1+k*20*Math.max(1,tom.scale*.8);ringM.scale.set(s,s,s);ringM.material.opacity=(1-k)*.75;if(ringT<=0)ringM.visible=false}
 if(G.brown&&Math.random()<dt*8)burst(V(0,4.5,0),3,'#7d5230',2,5,1,.8);else if(Math.random()<dt*7)burst(V(0,4.5,0),2,'#a8e0f0',2,5,1,.8);
 for(const c of clouds){c.position.x+=dt*1.2;if(c.position.x>230)c.position.x=-230}
 beacon.rotation.y+=dt;
 const fp=tom.p;const cx=G.mode==='menu'?0:fp.x,cz=G.mode==='menu'?0:fp.z;sun.position.set(cx+55,95,cz+40);sun.target.position.set(cx,0,cz);sun.shadow.camera.updateProjectionMatrix();
 if(G.mode==='play'){G.comboT-=dt;if(G.comboT<=0&&G.combo>0){G.combo=0;G.mult=1;persist()}hud();musicTick()}
 stepCam(dt);
 renderer.render(scene,cam);
}
requestAnimationFrame(tick);
})();
</script>
